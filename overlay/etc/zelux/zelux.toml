# ZELUX Duck Studio —— 整机唯一配置
#
# 谁来读这一份：
#   /usr/local/bin/zeluxd-run  → 翻成 ZELUX_* 环境变量后启动 zeluxd（唯一的生效入口）
#   /usr/local/bin/fanctl      → 风扇通道表 + 默认风速
#   /usr/local/bin/zelux-firstboot → 首次开机的口令 / 热点兜底参数
#   /usr/local/bin/zelux-update    → 升级源
#
# 改完必须 `sudo systemctl restart zeluxd zelux-fand` 才生效（只有首启参数需要重刷机）。
# 语法是 TOML：字符串用双引号，整数不要加引号，十六进制写 0x52。

[system]
# 首次开机写入 /etc/hostname（已经初始化过就不再改）
hostname = "zelux-duck"
# HTTP/WS 端口。改了记得同步改文档里 192.168.4.1:8000 的说法。
port = 8000
# 状态目录：auth.json / models / shots 都在这
state_dir = "/var/lib/zelux"
# 只在 /var/lib/zelux/auth.json 不存在时使用（默认口令，第一次登录后请在网页里改掉）
password = "zelux"
# 时区：RTC 不存在的板子靠 NTP + 这一行
timezone = "Asia/Shanghai"

[i2c]
# 板上 I²C 总线号：ToF 和 IMU 共用（/dev/i2c-3）
# TODO 真机确认：Radxa Zero 3W 的 40pin 上 I²C 走的是哪一路（见 docs/02-硬件接线.md）
bus = 3

[servo]
# 舵机总线：TTL 半双工，1 Mbps。注意这一路和官方镜像的串口控制台抢同一个 UART，
# 镜像构建时已经把 console=ttyS2 去掉（--keep-serial-console 可保留）。
# TODO 真机确认：转接板型号（是否需要 TX/RX 短接或方向脚）
port = "/dev/ttyS2"
baud = 1000000
# 15 颗舵机：右腿 10–14 / 左腿 20–24 / 头颈 30–34
ids = [10, 11, 12, 13, 14, 20, 21, 22, 23, 24, 30, 31, 32, 33, 34]

[tof]
# VL53L5CX：丝印地址 0x52（8 位写地址），驱动要 7 位 0x29。
# 需要 pip 包 vl53l5cx-ctypes（跑 zelux-tof-install 装）
addr = 0x52
hz = 15

[fan]
# zeluxd 以 zelux 用户跑，改不了 /sys/class/pwm，所以调速走这个 root 助手的 socket
socket = "/run/zelux/fan.sock"
# 25 kHz：40000 ns 周期。Feetech 舵机对低频 PWM 很敏感，别乱改
period_ns = 40000
# fanctl 启动时先给的安全风速。zeluxd 起来后会按温度曲线接管。
default_pct = 60

# 风扇 1：PWM14 / GPIO3_C4（全局 116），没有测速线
[[fan.channel]]
name = "顶部风扇"
pwm = 14
gpio = 116
tach = 0
# sysfs 里通道号是 chip 内偏移，不是全局号。
# TODO 真机确认：RK3566 一般 4 通道/chip，pwm14 → pwmchip3 的 pwm2。
# 不确定就把 chip 和 channel 都写 -1，让 fanctl 只找内核已经导出的通道（不 export，绝对不会动错脚）。
chip = 3
channel = 2

# 风扇 2：PWM12 / GPIO4_C6（全局 149，接口丝印 GPIO4_C6/PIN_24）+ 测速 GPIO150
[[fan.channel]]
name = "主板散热"
pwm = 12
gpio = 149
tach = 150
# TODO 真机确认：pwm12 → pwmchip3 的 pwm0
chip = 3
channel = 0

[wifi]
# 兜底热点：30 秒内没连上任何已知 WiFi 就开它（NetworkManager 的 shared 模式，192.168.4.1）
ap_connection = "zelux-ap"
ap_ssid = "ZELUX-Duck"
ap_password = "zeluxduck"
ap_ip = "192.168.4.1"
fallback_after_s = 30

[update]
# TODO 上线前填：GitHub 的 owner/repo，例如 "zelux/zelux-duck"。
# 留空时 zelux-update 只会做本地安装（--local），不会联网。
github = ""
# release 里的资产名模板（用 %s 填版本号）
asset = "zelux-duck-%s-arm64.tar.gz"
