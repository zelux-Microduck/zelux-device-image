# ZELUX 运行期目录：tmpfiles 在每次开机时把权限纠正回来
# （root 助手要在这里放 socket，zeluxd 要在这里找它）
d /run/zelux 0750 root zelux -
d /var/lib/zelux 0750 zelux zelux -
d /var/lib/zelux/models 0750 zelux zelux -
d /var/lib/zelux/shots 0750 zelux zelux -
# install.sh / 首启的回滚备份，只有 root 能读
d /var/lib/zelux/backup 0700 root root -
